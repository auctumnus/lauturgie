[package]
name = "lauturgie"
version = "0.1.0"
edition = "2021"
description = "A fast Rust reimplementation of the Lexurgy sound change applier"
license = "GPL-3.0-or-later"
repository = "https://github.com/auctumnus/lauturgie"
readme = "README.md"
keywords = ["conlang", "linguistics", "phonology", "sound-change", "lexurgy"]
categories = ["command-line-utilities", "science"]

# vendor/ is the Kotlin reference submodule (20 MB), needed only for the
# differential tests and benches; the tests/ and examples/ here read from it
# too, so they can't run from a published crate. None are needed to build the
# library or the CLI binary.
exclude = [
    "vendor",
    "tests",
    "examples",
    "docs",
    "coverage.sh",
    "Justfile",
    ".github",
    ".gitmodules",
]

[features]
# The HTTP API server binary (`lauturgie-server`), wire-compatible with
# Lexurgy's scv1 endpoints. Off by default so the library and CLI stay
# dependency-light; build/install it with `--features server`.
server = ["dep:axum", "dep:tokio", "dep:serde", "dep:serde_json", "dep:indexmap", "dep:uuid"]

[dependencies]
lalrpop-util = "0.23"
rayon = "1.10"
smol_str = "0.3.6"
unicode-normalization = "0.1.25"

# `server` feature only.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# Listed explicitly so `lauturgie-server` can carry `required-features`; the
# default CLI bin is named here too since an explicit `[[bin]]` disables
# auto-discovery for siblings.
[[bin]]
name = "lauturgie"

[[bin]]
name = "lauturgie-server"
required-features = ["server"]

[build-dependencies]
lalrpop = { version = "0.23", default-features = false }

[dev-dependencies]
unicode-normalization = "0.1.25"
pprof = { version = "0.15", features = ["flamegraph"] }

# keep frame pointers / symbols in release so flamegraphs are readable
[profile.release]
debug = true
